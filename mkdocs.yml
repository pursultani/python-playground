site_name: Python Playground
site_description: Learn to program by drawing, moving and clicking on a canvas.
site_url: !ENV [SITE_URL, ""]
use_directory_urls: true
strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [engine/lib]
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            docstring_section_style: list
            members_order: source
            heading_level: 2
            show_root_heading: true
            show_root_full_path: false
            show_root_toc_entry: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: false
            show_bases: false
            show_signature_annotations: true
            separate_signature: true
            show_attribute_values: false
            show_docstring_attributes: true
            show_if_no_docstring: false
            inherited_members: false
            merge_init_into_class: true
            show_labels: false
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Engine reference:
      - Overview: engine/index.md
      - Shapes: engine/shapes.md
      - Guides: engine/guides.md
      - Functions: engine/functions.md
      - Events: engine/events.md
      - Friendly errors: engine/errors.md
  - Developer:
      - Architecture: developer/architecture.md
      - Plan: developer/plan.md
      - Specs:
          - Public API: developer/specs/api.md
          - Protocol: developer/specs/protocol.md
          - Browser page: developer/specs/browser.md
          - Tooling: developer/specs/tooling.md
          - CI: developer/specs/ci.md
          - Examples: developer/specs/examples.md
